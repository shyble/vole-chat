[package]
name = "rust_lib_vole_chat"
version = "0.1.0"
edition = "2021"
description = "VoleNet protocol core for vole-chat: identity, signed messages, post-quantum sealed envelopes, hub client"
license = "MIT"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
ml-kem = "0.3"
ml-dsa = "0.1"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
futures-util = "0.3"
axum = { version = "0.8", features = ["ws", "json"] }
flutter_rust_bridge = "=2.13.0"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
# flutter_rust_bridge marks generated items with cfg(frb_expand)
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
